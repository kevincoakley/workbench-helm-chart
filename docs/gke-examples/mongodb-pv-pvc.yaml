---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: workbench-mongo-pv
spec:
  storageClassName: "standard"
  capacity:
    storage: 35
  accessModes:
    - ReadWriteOnce
  claimRef:
    namespace: workbench
    name: workbench-mongo-pvc
  gcePersistentDisk:
    pdName: workbench-mongo
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workbench-mongo-pvc
  namespace: workbench
spec:
  storageClassName: "standard"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 35